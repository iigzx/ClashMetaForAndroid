name: Build Maomao

# 只在分支 push 与手动触发时构建，避免和上游的 build-debug / build-pre-release 抢跑
on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

concurrency:
  group: maomao-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build arm64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ★ 不能用 checkout 的 submodules: recursive —— 它会带 --depth=1，
      #   子模块浅克隆后没有任何 remote 分支，CMake 里
      #   git branch -r --contains 查不到东西 → 版本号算空 → configure 直接报错。
      #   上游就是这么写的（不带 --depth ⇒ 子模块全量拉取）。
      - name: Checkout submodules
        run: git submodule update --init --recursive --force

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # 必须是 MetaCubeX 定制 Go（下面 Apply Go patches 依赖它的上下文），
      # @v5 标签不支持 go-download-base-url，会被忽略并退回官方 Go。
      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: '1.26'
          go-download-base-url: 'https://github.com/MetaCubeX/go/releases/download/build'

      - name: Apply Go patches
        run: |
          cd $(go env GOROOT)
          for p in $GITHUB_WORKSPACE/.github/patch/*.patch; do
            patch --verbose -p 1 < "$p"
          done

      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Update CA bundle
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates
          sudo update-ca-certificates
          cp -f /etc/ssl/certs/ca-certificates.crt \
                core/src/foss/golang/clash/component/ca/ca-certificates.crt

      - name: Show effective config
        run: |
          echo "--- applicationId / namespace ---"
          grep -n 'applicationId =\|namespace = if\|abiFilters\|removeSuffix = ' build.gradle.kts
          echo "--- version detection (CMake 会读这些) ---"
          git submodule foreach 'git branch -r --contains HEAD | head -3' || true
          echo "--- signing ---"
          test -f release.keystore && echo "release.keystore present" || echo "release.keystore MISSING"
          test -f signing.properties && echo "signing.properties present" || echo "signing.properties MISSING"

      - name: Build meta release
        run: ./gradlew --no-daemon --stacktrace app:assembleMetaRelease

      - name: Inspect APK
        run: |
          ls -lh app/build/outputs/apk/meta/release/ || true
          keytool -printcert -jarfile \
            "$(ls app/build/outputs/apk/meta/release/*.apk | head -1)" 2>/dev/null \
            | grep -E "Owner|SHA256" || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: maomao-arm64-apk
          path: app/build/outputs/apk/meta/release/*.apk
          if-no-files-found: error
